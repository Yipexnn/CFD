name: GUI (Windows)

# Separate workflow so a long first-time Qt/VTK build is never cancelled by new pushes:
# runs queue (latest pending wins) instead of cancelling the one in progress.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # GUI on Windows with vcpkg Qt 6 + VTK (first build is slow; binaries are cached).
  windows-gui:
    runs-on: windows-latest
    timeout-minutes: 340
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up vcpkg
        shell: bash
        run: |
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      # vcpkg's msmpi port needs this exact MS-MPI runtime (mpiexec) installed system-wide.
      - name: Install MS-MPI runtime
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\msmpisetup.exe"
          Invoke-WebRequest -Uri https://download.microsoft.com/download/7/2/7/72731ebb-b63c-4170-ade7-836966263a8f/msmpisetup.exe -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '-unattend', '-force' -Wait
          if (-not (Test-Path "C:\Program Files\Microsoft MPI\Bin\mpiexec.exe")) { throw "MS-MPI install failed" }
          "C:\Program Files\Microsoft MPI\Bin" >> $env:GITHUB_PATH

      - name: Restore vcpkg binaries
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gui2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'vcpkg/ports/**') }}
          restore-keys: vcpkg-gui2-${{ runner.os }}-

      - name: Configure (builds Qt and VTK on a cache miss)
        run: cmake --preset windows-msvc-gui-release -DCFD_WARNINGS_AS_ERRORS=ON

      # Save right after the expensive dependency build, even if later steps fail.
      - name: Save vcpkg binaries
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-gui2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'vcpkg/ports/**') }}-${{ github.run_id }}

      - name: Build
        run: cmake --build --preset windows-msvc-gui-release

      - name: Test
        run: ctest --preset windows-msvc-gui-release
