name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-msvc-release
          - os: ubuntu-latest
            preset: linux-gcc-release
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Set up vcpkg
        shell: bash
        run: |
          baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$baseline"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ matrix.preset }}-

      # Gmsh executable for the geometry tests (they are skipped without it).
      - name: Install Gmsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gmsh

      - name: Install Gmsh (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gmsh.zip" https://gmsh.info/bin/Windows/gmsh-4.13.1-Windows64.zip
          unzip -q "$RUNNER_TEMP/gmsh.zip" -d "$RUNNER_TEMP/gmsh"
          exe=$(find "$RUNNER_TEMP/gmsh" -name gmsh.exe | head -1)
          echo "CFD_GMSH=$(cygpath -w "$exe")" >> "$GITHUB_ENV"
          "$exe" --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DCFD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Smoke test
        shell: bash
        run: |
          ./build/${{ matrix.preset }}/src/app/cfd --version
          ./build/${{ matrix.preset }}/src/app/cfd --info

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          clang-format --version
          find src tests \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  # GUI on Linux with system Qt 5 / VTK 9.1 packages (fast), including a headless smoke run.
  linux-gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libvtk9-dev libvtk9-qt-dev qtbase5-dev \
            libeigen3-dev nlohmann-json3-dev libgtest-dev xvfb libgl1-mesa-dri xauth gmsh \
            libopenmpi-dev openmpi-bin

      - name: Configure
        run: cmake --preset linux-system-gui -DCFD_WARNINGS_AS_ERRORS=ON -DMPIEXEC_PREFLAGS=--oversubscribe

      - name: Build
        run: cmake --build --preset linux-system-gui

      - name: Test
        run: ctest --preset linux-system-gui

      - name: GUI smoke test (headless)
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            ./build/linux-system-gui/src/gui/cfd_gui examples/cavity.json --run \
            --show slice,vectors --screenshot gui-view.png --window-screenshot gui-window.png --quit
          test -s gui-view.png && test -s gui-window.png
          xvfb-run -a -s "-screen 0 1600x1000x24" \
            ./build/linux-system-gui/src/gui/cfd_gui examples/cylinder_2d.json --run \
            --window-screenshot gui-cylinder.png --quit
          test -s gui-cylinder.png
          grep -q cylinder_Cx examples/results/cylinder_2d/forces.csv
          rm -rf examples/results/cylinder_2d
          CFD_MPIEXEC_FLAGS=--oversubscribe xvfb-run -a -s "-screen 0 1600x1000x24" \
            ./build/linux-system-gui/src/gui/cfd_gui examples/cylinder_2d.json --processes 2 --run \
            --window-screenshot gui-cylinder-mpi.png --quit
          grep -q cylinder_Cx examples/results/cylinder_2d/forces.csv
          mpiexec --oversubscribe -n 4 ./build/linux-system-gui/src/app/cfd run examples/cavity.json
          mpiexec --oversubscribe -n 2 ./build/linux-system-gui/src/app/cfd run examples/heated_cavity.json
          grep -q xmin_Nu examples/results/heated_cavity/heat.csv
          mpiexec --oversubscribe -n 2 ./build/linux-system-gui/src/app/cfd run examples/conjugate_plate.json
          grep -q plate_Q examples/results/conjugate_plate/heat.csv
          mpiexec --oversubscribe -n 2 ./build/linux-system-gui/src/app/cfd run examples/dam_break.json
          test -s examples/results/dam_break/dam_break.vtu

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: gui-*.png
